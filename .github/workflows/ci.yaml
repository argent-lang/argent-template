name: Quality Control

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v6

      - name: Prepare compatible Argent checkout
        run: ./setup.sh

      - name: Run checks
        run: ./check.sh
