name: Quality Control

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unix:
    name: Unix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v6

      - name: Prepare compatible Argent checkout
        run: ./setup

      - name: Run checks
        run: ./check

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v6

      - name: Prepare compatible Argent checkout
        shell: powershell
        run: ./setup

      - name: Run checks
        shell: powershell
        run: ./check
